<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Bloom 学习社区</title>
<style>
:root{--cyan:#13cbd5;--pink:#ff5b9a;--ink:#24323a;--muted:#73818c;--bg:#fff7fb;--line:#f2dce7;--shadow:0 16px 35px #ff5b9a1c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 4% 0,#d6fcff,transparent 27%),radial-gradient(circle at 96% 5%,#ffe0ee,transparent 30%),var(--bg);color:var(--ink);font:15px/1.6 Arial,"Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.login{min-height:100vh;display:grid;place-items:center;padding:25px}.login-card,.card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.login-card{width:min(440px,100%);padding:34px}.logo{font-size:24px;font-weight:900}.logo i{color:var(--pink);font-style:normal}.eyebrow{color:#7860e9;font-size:11px;font-weight:800;letter-spacing:2px}.login-card h1{font-size:35px;line-height:1.15;margin:14px 0}.muted{color:var(--muted)}.field{margin:17px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fffaff;outline:0}.btn{padding:11px 17px;border-radius:12px;background:var(--pink);color:white;font-weight:800}.btn.cyan{background:var(--cyan);color:#07383d}.top{position:sticky;top:0;z-index:4;background:#ffffffdb;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:15px 5vw}.top .logo{margin-right:auto}.tags{display:flex;gap:5px;overflow:auto}.tags button{padding:9px 13px;background:none;color:var(--muted);border-radius:999px;white-space:nowrap}.tags button.active,.tags button:hover{background:#ffe0ed;color:#ce3976}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:900;background:linear-gradient(135deg,var(--cyan),var(--pink))}.main{max-width:1200px;margin:auto;padding:34px 5vw}.welcome{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.welcome h1{font-size:38px;margin:6px 0}.spark{color:var(--pink)}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:18px}.card{padding:22px;margin-bottom:18px}.hero{background:linear-gradient(120deg,#c9fbff,#ffe0ed);border:0;position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:25px;top:5px;color:#fff9;font-size:100px}.hero h2{font-size:28px;max-width:540px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{padding:14px;border:1px solid var(--line);background:#fff9fc;border-radius:13px}.stat b{display:block;font-size:26px;color:#7761e9}.stat span{font-size:12px;color:var(--muted)}.task,.post,.note{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.task:last-child,.post:last-child,.note:last-child{border:0}.tick{width:28px;height:28px;border:2px solid #efb6ce;border-radius:50%;background:#fff;color:#fff;flex:none}.tick.done{background:var(--pink);border-color:var(--pink)}.task-main{flex:1}.task-title{font-weight:800}.task-meta{font-size:12px;color:var(--muted)}.lesson-box{margin-top:9px;padding:11px 13px;background:#fff8fc;border-left:3px solid var(--cyan);border-radius:9px;font-size:13px}.lesson-box b{color:#d53f78}.quiz-box{margin-top:10px;padding:11px 13px;background:#f1feff;border-radius:9px;font-size:13px}.quiz-answer{display:none;margin-top:6px;color:#13828b}.quiz-answer.show{display:block}.quiz-btn{margin-top:7px;padding:5px 9px;border-radius:8px;background:#ffe0ed;color:#c53672;font-size:12px}@media(max-width:780px){.top{flex-wrap:wrap}.top .logo{width:100%}.tags{order:3;width:100%}.grid{grid-template-columns:1fr}.welcome h1{font-size:30px}}
</style></head><body><div id="app"></div><script>
var token=localStorage.getItem('bloom-token'),me,tasks=[],progress={},notes=[],posts=[],tab='课程学习';
function api(p,o){o=o||{};o.headers=Object.assign({'Content-Type':'application/json'},token?{Authorization:'Bearer '+token}:{});return fetch(p,o).then(function(r){return r.text().then(function(raw){var d={};try{d=raw?JSON.parse(raw):{}}catch(e){throw Error('服务器返回了无效响应，请稍后重试')}if(!r.ok)throw Error(d.error||'请求失败');return d})})}
function login(admin){app.innerHTML='<main class="login"><section class="login-card"><div class="logo">AI <i>BLOOM</i></div><div class="eyebrow">'+(admin?'ADMIN SPACE':'LEARN TOGETHER')+'</div><h1>'+(admin?'管理员控制台':'让每天的学习开出花。')+'</h1><p class="muted">'+(admin?'查看平台活跃度与学习数据。':'课程、笔记、问题与伙伴，都在这里。')+'</p><div class="field"><label>邮箱</label><input id="email"></div><div class="field"><label>'+(admin?'密码':'验证码')+'</label><input id="secret" type="password" placeholder="'+(admin?'请输入管理员密码':'123456')+'"></div><button class="btn" id="go">'+(admin?'进入管理端':'开始学习')+'</button><p class="muted" style="font-size:12px">'+(admin?'请使用网站管理员提供的账号登录。':'演示验证码：123456　管理员入口：<a href="#admin">打开</a>')+'</p></section></main>';go.onclick=function(){var req=admin?api('/api/admin/login',{method:'POST',body:JSON.stringify({email:email.value,password:secret.value})}):api('/api/auth/login',{method:'POST',body:JSON.stringify({email:email.value,code:secret.value})});req.then(function(d){token=d.token;localStorage.setItem('bloom-token',token);boot()}).catch(function(e){alert(e.message)})}}
function boot(){Promise.all([api('/api/me'),api('/api/tasks'),api('/api/progress'),api('/api/notes'),api('/api/forum')]).then(function(x){me=x[0].user;tasks=x[1].tasks;progress=x[2].progress;notes=x[3].notes;posts=x[4].posts;render()}).catch(function(){localStorage.removeItem('bloom-token');token=null;login(false)})}
function shell(content){app.innerHTML='<header class="top"><div class="logo">AI <i>BLOOM</i></div><nav class="tags">'+['课程学习','学习笔记','问题论坛','我的'].map(function(x){return '<button class="'+(tab===x?'active':'')+'" onclick="switchTab(\''+x+'\')">'+x+'</button>'}).join('')+'</nav><div class="avatar">'+me.email[0].toUpperCase()+'</div></header><main class="main">'+content+'</main>'}
function render(){if(me.role==='admin')return admin();if(tab==='学习笔记')return notesPage();if(tab==='问题论坛')return forumPage();if(tab==='我的')return profilePage();var done=Object.values(progress).filter(function(x){return x.done}).length,today=tasks[0];shell('<div class="welcome"><div><div class="eyebrow">HELLO, '+me.email.split('@')[0].toUpperCase()+'</div><h1>今天也要发光 <span class="spark">✦</span></h1><p class="muted">完成一个小目标，进度会自己长出来。</p></div><button class="btn" onclick="logout()">退出</button></div><div class="grid"><section><div class="card hero"><div class="eyebrow">TODAY FOCUS · '+today.module+'</div><h2>'+today.title+'</h2><p>'+today.description+'</p><button class="btn cyan" onclick="toggle(\''+today.date+'\')">'+(progress[today.date]&&progress[today.date].done?'今日已完成 ✓':'完成今日打卡')+'</button></div><div class="stats"><div class="stat"><b>'+done+'</b><span>完成课程</span></div><div class="stat"><b>'+Math.round(done/tasks.length*100)+'%</b><span>总进度</span></div><div class="stat"><b>'+Object.values(progress).reduce(function(n,x){return n+(x.minutes||0)},0)+'</b><span>累计分钟</span></div></div><div class="card"><h2>课程时间线</h2>'+tasks.map(task).join('')+'</div></section><aside class="card"><h2>本周节奏</h2><p class="muted">理论、案例、实操、复盘，四种节奏轮换，保持新鲜感。</p><div class="stats">'+[1,2,3,4,5,6,7,8].map(function(w){return '<div class="stat"><b>'+tasks.filter(function(t){return t.week===w&&progress[t.date]&&progress[t.date].done}).length+'</b><span>第 '+w+' 周</span></div>'}).join('')+'</div></aside></div>')}
function task(t){var p=progress[t.date]||{};return '<div class="task"><button class="tick '+(p.done?'done':'')+'" onclick="toggle(\''+t.date+'\')">'+(p.done?'✓':'')+'</button><div class="task-main"><div class="task-title">'+t.date+' · '+t.title+'</div><div class="task-meta">'+t.module+' · '+t.minutes+' 分钟 · 掌握目标：'+t.masteryTarget+'</div><a href="'+t.resource+'" target="_blank">打开课程入口 ↗</a><div class="lesson-box"><b>今天怎么学：</b>'+t.description+'<br><b>实操：</b>'+t.practice+'</div><div class="quiz-box"><b>检测题：</b>'+t.question+'<br><button class="quiz-btn" onclick="this.nextElementSibling.classList.toggle(\'show\')">查看参考答案</button><span class="quiz-answer">'+t.answer+'</span></div></div></div>'}
function notesPage(){shell('<div class="welcome"><div><div class="eyebrow">YOUR NOTES</div><h1>学习笔记</h1><p class="muted">把今天的理解，变成明天的捷径。</p></div></div><div class="grid"><section class="card"><h2>写一条新笔记</h2><div class="field"><input id="nt" placeholder="标题"></div><div class="field"><textarea id="nc" rows="7" placeholder="记录概念、代码或灵感"></textarea></div><button class="btn" onclick="addNote()">保存笔记</button></section><section class="card"><h2>最近笔记</h2>'+(notes.length?notes.map(function(n){return '<div class="note"><div><b>'+n.title+'</b><p class="muted">'+n.content+'</p></div></div>'}).join(''):'<div class="empty">还没有笔记。</div>')+'</section></div>')}
function forumPage(){shell('<div class="welcome"><div><div class="eyebrow">COMMUNITY</div><h1>问题论坛</h1><p class="muted">提问、交流、一起把卡点变成突破口。</p></div></div><section class="card"><div class="field"><input id="pt" placeholder="问题标题"></div><div class="field"><textarea id="pc" rows="3" placeholder="描述你的问题"></textarea></div><button class="btn" onclick="addPost()">发布问题</button>'+(posts.length?posts.map(function(p){return '<div class="post"><div><b>'+p.title+'</b><p>'+p.content+'</p><span class="muted">'+p.author+'</span></div></div>'}).join(''):'<div class="empty">论坛还很安静，来发起第一个问题。</div>')+'</section>')}
function profilePage(){shell('<div class="welcome"><div><div class="eyebrow">YOUR SPACE</div><h1>我的</h1><p class="muted">调整你的学习身份与节奏。</p></div></div><section class="card"><div class="field"><label>昵称</label><input id="pn" value="'+(me.nickname||'')+'"></div><div class="field"><label>个人简介</label><textarea id="pb" rows="4">'+(me.bio||'')+'</textarea></div><button class="btn" onclick="saveProfile()">保存资料</button></section>')}
function switchTab(x){tab=x;render()}function toggle(date){var p=progress[date]||{};api('/api/progress',{method:'POST',body:JSON.stringify({date:date,done:!p.done,minutes:120,note:p.note||''})}).then(function(d){progress[date]=d.progress;render()})}function addNote(){api('/api/notes',{method:'POST',body:JSON.stringify({title:nt.value,content:nc.value})}).then(function(d){notes.unshift(d.note);render()})}function addPost(){api('/api/forum',{method:'POST',body:JSON.stringify({title:pt.value,content:pc.value})}).then(function(d){posts.unshift(d.post);render()})}function saveProfile(){api('/api/profile',{method:'PUT',body:JSON.stringify({nickname:pn.value,bio:pb.value})}).then(function(d){me=d.user;alert('资料已保存')})}function logout(){localStorage.removeItem('bloom-token');token=null;login(false)}function admin(){api('/api/admin/stats').then(function(s){app.innerHTML='<main class="login"><section class="login-card"><div class="logo">AI <i>BLOOM</i></div><div class="eyebrow">ADMIN SPACE</div><h1>运营控制台</h1><div class="stats"><div class="stat"><b>'+s.users+'</b><span>用户</span></div><div class="stat"><b>'+s.records+'</b><span>打卡</span></div><div class="stat"><b>'+s.posts+'</b><span>帖子</span></div><div class="stat"><b>'+s.tasks+'</b><span>课程</span></div></div><p class="muted">后端已拆分用户、课程、打卡、笔记、论坛与统计数据。</p><button class="btn" onclick="logout()">退出管理端</button></section></main>'})}if(location.hash==='#admin')login(true);else if(token)boot();else login(false);
</script></body></html>
