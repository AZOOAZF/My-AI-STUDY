<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Bloom 学习社区</title>
<style>
:root{--cyan:#0ca8b5;--pink:#e94b86;--green:#247a62;--ink:#223038;--muted:#6f7d86;--bg:#f8fafb;--line:#dfe6e9;--soft:#f2f6f7;--danger:#b42318;--shadow:0 10px 28px rgba(33,48,56,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Arial,"Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.muted{color:var(--muted)}.brand{font-size:23px;font-weight:900}.brand b{color:var(--pink)}
.auth-page{min-height:100vh;display:grid;grid-template-columns:minmax(320px,560px) minmax(360px,1fr)}.auth-panel{display:flex;align-items:center;justify-content:center;padding:40px;background:#fff}.auth-card{width:min(420px,100%)}.auth-card h1{font-size:32px;line-height:1.2;margin:28px 0 8px}.auth-tabs{display:flex;border-bottom:1px solid var(--line);margin:25px 0 20px}.auth-tabs button{flex:1;padding:11px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-weight:700}.auth-tabs button.active{color:var(--ink);border-color:var(--pink)}.auth-scene{background:#173d43;color:#fff;display:flex;align-items:flex-end;padding:7vw;position:relative;overflow:hidden}.auth-scene:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,rgba(12,168,181,.35),transparent 45%),linear-gradient(25deg,rgba(233,75,134,.25),transparent 50%)}.scene-copy{position:relative;max-width:560px}.scene-copy h2{font-size:38px;line-height:1.2;margin:0 0 12px}.scene-copy p{color:#d7e7e9;font-size:17px}.mail-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.mail-list span{border:1px solid #ffffff3d;padding:5px 10px;border-radius:5px;font-size:12px}
.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(12,168,181,.12)}.code-row{display:grid;grid-template-columns:1fr auto;gap:8px}.btn{border:0;border-radius:6px;padding:11px 16px;background:var(--pink);color:#fff;font-weight:800}.btn.secondary{background:#e8f7f8;color:#12636a}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.55;cursor:not-allowed}.form-error{min-height:24px;color:var(--danger);font-size:13px}.form-tip{font-size:12px;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:13px max(24px,5vw)}.top .brand{margin-right:auto}.tags{display:flex;gap:3px}.tags button{padding:8px 12px;border:0;background:none;color:var(--muted);border-radius:5px}.tags button.active,.tags button:hover{background:#eef7f7;color:#12636a}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;background:var(--cyan)}.main{max-width:1180px;margin:auto;padding:32px max(20px,5vw)}.welcome{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.welcome h1{font-size:32px;margin:3px 0}.eyebrow{color:var(--green);font-size:11px;font-weight:800}.grid{display:grid;grid-template-columns:1.45fr .85fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:21px;margin-bottom:18px;box-shadow:var(--shadow)}.card h2,.card h3{margin-top:0}.hero{border-top:4px solid var(--cyan)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{padding:14px;border:1px solid var(--line);background:var(--soft);border-radius:6px}.stat b{display:block;font-size:25px;color:var(--green)}.stat span{font-size:12px;color:var(--muted)}
.task,.post,.note{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.task:last-child,.post:last-child,.note:last-child{border:0}.tick{width:27px;height:27px;border:2px solid #b9c7cc;border-radius:50%;background:#fff;color:#fff;flex:none}.tick.done{background:var(--green);border-color:var(--green)}.task-main{flex:1}.task-title{font-weight:800}.task-meta{font-size:12px;color:var(--muted)}.lesson-box,.quiz-box{margin-top:9px;padding:10px 12px;background:var(--soft);border-radius:5px;font-size:13px}.lesson-box{border-left:3px solid var(--cyan)}.quiz-answer{display:none;margin-top:6px;color:var(--green)}.quiz-answer.show{display:block}.quiz-btn{margin-top:7px;padding:5px 9px;border:0;border-radius:5px;background:#fce6ef;color:#a82e61;font-size:12px}
.profile-layout{display:grid;grid-template-columns:270px 1fr;gap:18px}.profile-summary{align-self:start;position:sticky;top:82px}.profile-avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--cyan);color:#fff;font-size:27px;font-weight:900;margin-bottom:15px}.profile-completion{height:7px;background:#e8edef;border-radius:4px;overflow:hidden;margin-top:8px}.profile-completion i{display:block;height:100%;background:var(--green)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.span-2{grid-column:1/-1}.checks{display:flex;flex-wrap:wrap;gap:8px}.check{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:5px;padding:7px 9px}.check input{width:auto}.section-title{padding-bottom:10px;border-bottom:1px solid var(--line);margin:8px 0 4px}.required{color:var(--danger)}.onboarding{max-width:820px}.onboarding-head{margin-bottom:20px}.onboarding-head h1{font-size:30px;margin:4px 0}.save-row{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:18px}.empty{padding:30px 0;color:var(--muted);text-align:center}
@media(max-width:820px){.auth-page{grid-template-columns:1fr}.auth-scene{display:none}.auth-panel{padding:28px 20px}.top{flex-wrap:wrap}.top .brand{width:100%}.tags{order:3;width:100%;overflow:auto}.grid,.profile-layout,.form-grid{grid-template-columns:1fr}.span-2{grid-column:auto}.profile-summary{position:static}.welcome{align-items:flex-start}.welcome h1{font-size:27px}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{padding:10px}.stat b{font-size:21px}}
</style></head><body><div id="app"></div><script>
var token=localStorage.getItem('bloom-token'),me,tasks=[],progress={},notes=[],posts=[],tab='课程学习',authMode='login';
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function api(p,o){o=o||{};o.headers=Object.assign({'Content-Type':'application/json'},token?{Authorization:'Bearer '+token}:{});return fetch(p,o).then(function(r){return r.text().then(function(raw){var d={};try{d=raw?JSON.parse(raw):{}}catch(e){throw Error('服务器返回了无效响应')}if(!r.ok)throw Error(d.error||'请求失败');return d})})}
function authPage(mode){authMode=mode||authMode;app.innerHTML='<main class="auth-page"><section class="auth-panel"><div class="auth-card"><div class="brand">AI <b>BLOOM</b></div><h1>'+(authMode==='register'?'创建学习账户':'欢迎回来')+'</h1><p class="muted">'+(authMode==='register'?'一个邮箱只能注册一个账户，注册后需要先完善学习档案。':'使用注册邮箱接收验证码，无需记忆密码。')+'</p><div class="auth-tabs"><button class="'+(authMode==='login'?'active':'')+'" onclick="authPage(\'login\')">登录</button><button class="'+(authMode==='register'?'active':'')+'" onclick="authPage(\'register\')">注册</button></div><div class="field"><label>邮箱地址</label><input id="authEmail" type="email" autocomplete="email" placeholder="name@example.com"></div><div class="field"><label>邮箱验证码</label><div class="code-row"><input id="authCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 位验证码"><button class="btn secondary" id="sendCode" onclick="requestCode()">获取验证码</button></div></div><div id="authError" class="form-error"></div><button class="btn" style="width:100%" id="authSubmit" onclick="submitAuth()">'+(authMode==='register'?'注册并继续':'登录')+'</button><p class="form-tip">继续即表示你同意将邮箱用于账户验证和必要服务通知。</p></div></section><aside class="auth-scene"><div class="scene-copy"><h2>把每一次学习，沉淀成自己的成长轨迹。</h2><p>支持向常见国内外邮箱发送验证码，实际送达速度由收件服务商和网络状况决定。</p><div class="mail-list"><span>QQ 邮箱</span><span>网易邮箱</span><span>Gmail</span><span>Outlook</span><span>iCloud Mail</span></div></div></aside></main>'}
function requestCode(){var email=authEmail.value.trim(),btn=sendCode,err=authError;err.textContent='';err.style.color='var(--danger)';if(!email){err.textContent='请先填写邮箱地址';return}btn.disabled=true;api('/api/auth/request-code',{method:'POST',body:JSON.stringify({email:email,purpose:authMode})}).then(function(d){var left=60;btn.textContent=left+' 秒后重试';var timer=setInterval(function(){left--;btn.textContent=left+' 秒后重试';if(left<=0){clearInterval(timer);btn.disabled=false;btn.textContent='重新发送'}},1000);err.style.color='var(--green)';err.textContent=d.message+(d.devCode?'（本地验证码：'+d.devCode+'）':'')}).catch(function(e){btn.disabled=false;err.textContent=e.message})}
function submitAuth(){authError.style.color='var(--danger)';authError.textContent='';authSubmit.disabled=true;api('/api/auth/login',{method:'POST',body:JSON.stringify({email:authEmail.value.trim(),code:authCode.value.trim(),purpose:authMode})}).then(function(d){token=d.token;localStorage.setItem('bloom-token',token);boot()}).catch(function(e){authError.textContent=e.message}).finally(function(){authSubmit.disabled=false})}
function boot(){Promise.all([api('/api/me'),api('/api/tasks'),api('/api/progress'),api('/api/notes'),api('/api/forum')]).then(function(x){me=x[0].user;tasks=x[1].tasks;progress=x[2].progress;notes=x[3].notes;posts=x[4].posts;if(me.role!=='admin'&&!me.profileCompleted){profilePage(true);return}render()}).catch(function(){localStorage.removeItem('bloom-token');token=null;authPage('login')})}
function shell(content){app.innerHTML='<header class="top"><div class="brand">AI <b>BLOOM</b></div><nav class="tags">'+['课程学习','学习笔记','问题论坛','我的'].map(function(x){return '<button class="'+(tab===x?'active':'')+'" onclick="switchTab(\''+x+'\')">'+x+'</button>'}).join('')+'</nav><div class="avatar">'+esc((me.nickname||me.email||'?')[0].toUpperCase())+'</div></header><main class="main">'+content+'</main>'}
function render(){if(me.role==='admin')return admin();if(!me.profileCompleted)return profilePage(true);if(tab==='学习笔记')return notesPage();if(tab==='问题论坛')return forumPage();if(tab==='我的')return profilePage(false);var done=Object.values(progress).filter(function(x){return x.done}).length,today=tasks[0];shell('<div class="welcome"><div><div class="eyebrow">HELLO, '+esc(me.nickname||me.email.split('@')[0])+'</div><h1>今天也要发光</h1><p class="muted">完成一个小目标，进度会自己长出来。</p></div><button class="btn ghost" onclick="logout()">退出</button></div><div class="grid"><section><div class="card hero"><div class="eyebrow">TODAY FOCUS · '+esc(today.module)+'</div><h2>'+esc(today.title)+'</h2><p>'+esc(today.description)+'</p><button class="btn secondary" onclick="toggle(\''+today.date+'\')">'+(progress[today.date]&&progress[today.date].done?'今日已完成 ✓':'完成今日打卡')+'</button></div><div class="stats"><div class="stat"><b>'+done+'</b><span>完成课程</span></div><div class="stat"><b>'+Math.round(done/tasks.length*100)+'%</b><span>总进度</span></div><div class="stat"><b>'+Object.values(progress).reduce(function(n,x){return n+(x.minutes||0)},0)+'</b><span>累计分钟</span></div></div><div class="card"><h2>课程时间线</h2>'+tasks.map(taskItem).join('')+'</div></section><aside class="card"><h2>本周节奏</h2><p class="muted">理论、案例、实操与复盘轮换，建立稳定节奏。</p><div class="stats">'+[1,2,3,4,5,6,7,8].map(function(w){return '<div class="stat"><b>'+tasks.filter(function(t){return t.week===w&&progress[t.date]&&progress[t.date].done}).length+'</b><span>第 '+w+' 周</span></div>'}).join('')+'</div></aside></div>')}
function taskItem(t){var p=progress[t.date]||{};return '<div class="task"><button class="tick '+(p.done?'done':'')+'" onclick="toggle(\''+t.date+'\')">'+(p.done?'✓':'')+'</button><div class="task-main"><div class="task-title">'+esc(t.date+' · '+t.title)+'</div><div class="task-meta">'+esc(t.module+' · '+t.minutes+' 分钟')+'</div><a href="'+esc(t.resource)+'" target="_blank" rel="noopener">打开课程入口 ↗</a><div class="lesson-box"><b>实操：</b>'+esc(t.practice)+'</div><div class="quiz-box"><b>检测题：</b>'+esc(t.question)+'<br><button class="quiz-btn" onclick="this.nextElementSibling.classList.toggle(\'show\')">查看参考答案</button><span class="quiz-answer">'+esc(t.answer)+'</span></div></div></div>'}
function notesPage(){shell('<div class="welcome"><div><div class="eyebrow">YOUR NOTES</div><h1>学习笔记</h1><p class="muted">把今天的理解变成明天的捷径。</p></div></div><div class="grid"><section class="card"><h2>写一条新笔记</h2><div class="field"><input id="nt" placeholder="标题"></div><div class="field"><textarea id="nc" rows="7" placeholder="记录概念、代码或灵感"></textarea></div><button class="btn" onclick="addNote()">保存笔记</button></section><section class="card"><h2>最近笔记</h2>'+(notes.length?notes.map(function(n){return '<div class="note"><div><b>'+esc(n.title)+'</b><p class="muted">'+esc(n.content)+'</p></div></div>'}).join(''):'<div class="empty">还没有笔记。</div>')+'</section></div>')}
function forumPage(){shell('<div class="welcome"><div><div class="eyebrow">COMMUNITY</div><h1>问题论坛</h1><p class="muted">提问、交流，一起解决学习卡点。</p></div></div><section class="card"><div class="field"><input id="pt" placeholder="问题标题"></div><div class="field"><textarea id="pc" rows="3" placeholder="描述你的问题"></textarea></div><button class="btn" onclick="addPost()">发布问题</button>'+(posts.length?posts.map(function(p){return '<div class="post"><div><b>'+esc(p.title)+'</b><p>'+esc(p.content)+'</p><span class="muted">'+esc(p.author)+'</span></div></div>'}).join(''):'<div class="empty">论坛还很安静，来发起第一个问题。</div>')+'</section>')}
var interestOptions=['Python','大模型原理','提示词工程','RAG','AI Agent','自动化','数据分析','产品设计','模型部署','开源项目'];
function inputField(label,id,value,placeholder,required){return '<div class="field"><label>'+label+(required?' <span class="required">*</span>':'')+'</label><input id="'+id+'" value="'+esc(value||'')+'" placeholder="'+esc(placeholder||'')+'"></div>'}
function selectField(label,id,value,options,required){return '<div class="field"><label>'+label+(required?' <span class="required">*</span>':'')+'</label><select id="'+id+'"><option value="">请选择</option>'+options.map(function(x){return '<option '+(String(value||'')===x?'selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select></div>'}
function profileForm(first){var interests=me.interests||[];return '<div class="card"><h3 class="section-title">基本资料</h3><div class="form-grid">'+inputField('昵称','pn',me.nickname,'社区中展示的名称',true)+inputField('姓名','pf',me.fullName,'选填，仅用于个人档案')+inputField('国家或地区','pco',me.country,'例如：中国',true)+inputField('城市','pci',me.city,'例如：上海')+selectField('时区','ptz',me.timezone,['Asia/Shanghai','Asia/Hong_Kong','Asia/Tokyo','Europe/London','America/New_York','America/Los_Angeles'])+selectField('界面语言','plang',me.language,['简体中文','繁體中文','English'])+'</div><h3 class="section-title">职业与学习背景</h3><div class="form-grid">'+inputField('职业或身份','po',me.occupation,'例如：学生、开发者、产品经理')+inputField('公司或学校','porg',me.organization,'选填')+selectField('AI 经验水平','pel',me.experienceLevel,['刚刚开始','了解基础概念','做过小项目','能够独立开发','专业从业者'],true)+selectField('每周学习时间','pwh',me.weeklyHours,['少于 3 小时','3-5 小时','6-10 小时','11-20 小时','20 小时以上'])+'</div><h3 class="section-title">学习目标与偏好</h3><div class="field"><label>主要学习目标 <span class="required">*</span></label><textarea id="pg" rows="4" placeholder="你希望通过 AI 学习解决什么问题？">'+esc(me.learningGoal||'')+'</textarea></div><div class="field"><label>感兴趣的方向</label><div class="checks">'+interestOptions.map(function(x){return '<label class="check"><input type="checkbox" name="interest" value="'+esc(x)+'" '+(interests.includes(x)?'checked':'')+'>'+esc(x)+'</label>'}).join('')+'</div></div><div class="form-grid">'+selectField('偏好的学习方式','pls',me.learningStyle,['系统课程','项目实战','阅读文档','视频学习','社区讨论'])+selectField('常用学习时段','pst',me.preferredStudyTime,['清晨','上午','下午','晚上','不固定'])+'</div><h3 class="section-title">个人介绍与链接</h3><div class="field"><label>个人简介</label><textarea id="pb" rows="4" maxlength="500" placeholder="介绍你的背景、项目或希望认识的学习伙伴">'+esc(me.bio||'')+'</textarea></div><div class="form-grid">'+inputField('个人网站','pweb',me.website,'https://')+inputField('GitHub','pgh',me.github,'用户名或主页地址')+'</div><label class="check"><input id="pdiscover" type="checkbox" '+(me.allowDiscovery?'checked':'')+'>允许其他学习者通过社区资料认识我</label><div class="save-row"><span id="profileMsg" class="form-error"></span><button class="btn" onclick="saveProfile('+!!first+')">'+(first?'完成资料并开始学习':'保存资料')+'</button></div></div>'}
function profilePage(first){var completed=[me.nickname,me.country,me.experienceLevel,me.learningGoal,me.occupation,me.bio].filter(Boolean).length,percent=Math.round(completed/6*100),form=profileForm(first);if(first){app.innerHTML='<main class="main onboarding"><div class="onboarding-head"><div class="brand">AI <b>BLOOM</b></div><div class="eyebrow">FIRST STEP</div><h1>先创建你的学习档案</h1><p class="muted">这些信息将帮助平台呈现更合适的学习节奏。带星号的项目为必填。</p></div>'+form+'</main>';return}shell('<div class="welcome"><div><div class="eyebrow">YOUR SPACE</div><h1>我的</h1><p class="muted">管理身份、学习目标与偏好。</p></div><button class="btn ghost" onclick="logout()">退出账户</button></div><div class="profile-layout"><aside class="card profile-summary"><div class="profile-avatar">'+esc((me.nickname||me.email)[0].toUpperCase())+'</div><h2>'+esc(me.nickname||'未设置昵称')+'</h2><p class="muted">'+esc(me.email)+'</p><p>'+esc(me.occupation||'尚未填写职业信息')+'</p><b>档案完整度 '+percent+'%</b><div class="profile-completion"><i style="width:'+percent+'%"></i></div><p class="form-tip">注册时间：'+esc((me.registeredAt||'').slice(0,10)||'未知')+'</p></aside><section>'+form+'</section></div>')}
function saveProfile(first){var values={nickname:pn.value,fullName:pf.value,country:pco.value,city:pci.value,timezone:ptz.value,language:plang.value,occupation:po.value,organization:porg.value,experienceLevel:pel.value,weeklyHours:pwh.value,learningGoal:pg.value,interests:Array.from(document.querySelectorAll('input[name=interest]:checked')).map(function(x){return x.value}),learningStyle:pls.value,preferredStudyTime:pst.value,bio:pb.value,website:pweb.value,github:pgh.value,allowDiscovery:pdiscover.checked};profileMsg.textContent='保存中...';profileMsg.style.color='var(--muted)';api('/api/profile',{method:'PUT',body:JSON.stringify(values)}).then(function(d){me=d.user;if(first){tab='课程学习';render()}else{profileMsg.style.color='var(--green)';profileMsg.textContent='资料已保存'}}).catch(function(e){profileMsg.style.color='var(--danger)';profileMsg.textContent=e.message})}
function switchTab(x){tab=x;render()}function toggle(date){var p=progress[date]||{};api('/api/progress',{method:'POST',body:JSON.stringify({date:date,done:!p.done,minutes:120,note:p.note||''})}).then(function(d){progress[date]=d.progress;render()})}function addNote(){api('/api/notes',{method:'POST',body:JSON.stringify({title:nt.value,content:nc.value})}).then(function(d){notes.unshift(d.note);render()})}function addPost(){api('/api/forum',{method:'POST',body:JSON.stringify({title:pt.value,content:pc.value})}).then(function(d){posts.unshift(d.post);render()})}function logout(){localStorage.removeItem('bloom-token');token=null;me=null;authPage('login')}function admin(){api('/api/admin/stats').then(function(s){app.innerHTML='<main class="main"><section class="card"><div class="brand">AI <b>BLOOM</b></div><h1>运营控制台</h1><div class="stats"><div class="stat"><b>'+s.users+'</b><span>用户</span></div><div class="stat"><b>'+s.records+'</b><span>打卡</span></div><div class="stat"><b>'+s.posts+'</b><span>帖子</span></div></div><button class="btn ghost" onclick="logout()">退出</button></section></main>'})}
if(token)boot();else authPage('login');
</script></body></html>
